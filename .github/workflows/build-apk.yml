name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 本机因网络原因使用国内镜像，但 GitHub 海外 Runner 需要官方源
      - name: 切换官方下载源
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#https://maven.aliyun.com/repository/google#https://dl.google.com/dl/android/maven2#g' settings.gradle.kts
          sed -i 's#https://maven.aliyun.com/repository/central#https://repo1.maven.org/maven2#g' settings.gradle.kts
          sed -i 's#https://maven.aliyun.com/repository/public#https://repo1.maven.org/maven2#g' settings.gradle.kts
          sed -i 's#https://maven.aliyun.com/repository/gradle-plugin#https://plugins.gradle.org/m2#g' settings.gradle.kts

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: aichat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 打 tag（如 v1.0.0）时自动发布 Release，手机可直接下载安装
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
